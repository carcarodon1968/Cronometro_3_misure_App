name: Build APK & Deploy Web App Link

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java JDK 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Read App Version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version || '1.0.4'")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Fix package.json versions, Write version.json & Build Web App
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const version = pkg.version || "1.0.4";
            const runNumber = Number("${{ github.run_number }}") || 1;
            const repo = "${{ github.repository }}" || "carcarodon1968/Cronometro_3_misure_App";
            pkg.dependencies = {
              "firebase": "latest",
              "react": "^19.0.0",
              "react-dom": "^19.0.0",
              "lucide-react": "latest"
            };
            pkg.devDependencies = {
              "@tailwindcss/vite": "^4.0.0",
              "@types/node": "^22.0.0",
              "@types/react": "^19.0.0",
              "@types/react-dom": "^19.0.0",
              "@vitejs/plugin-react": "^4.3.0",
              "tailwindcss": "^4.0.0",
              "typescript": "^5.7.0",
              "vite": "^6.0.0",
              "vite-plugin-pwa": "^0.21.0"
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            const manifest = {
              version,
              buildNumber: runNumber,
              commit: "${{ github.sha }}".slice(0, 7),
              builtAt: new Date().toISOString(),
              apkUrl: `https://github.com/${repo}/releases/download/v.${version}/Cronometro_3_misure_v.${version}.apk`,
              releasesPageUrl: `https://github.com/${repo}/releases/tag/v.${version}`
            };
            fs.writeFileSync("public/version.json", JSON.stringify(manifest, null, 2));
          '
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Fixed Android Signing Keystore (for seamless APK updates without uninstalling)
        run: |
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore /tmp/fixed_debug.p12
          echo "" | base64 -d > /tmp/fixed_debug.p12
          keytool -importkeystore \
            -srckeystore /tmp/fixed_debug.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass android \
            -destkeystore ~/.android/debug.keystore \
            -deststorepass android \
            -destkeypass android \
            -noprompt

      - name: Build Installable Android APK (Cronometro 3 misure)
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          rm -rf capacitor.config.* android
          npx cap init "Cronometro 3 misure" "com.cronometro3misure.app" --web-dir dist
          npx cap add android
          VER_CODE=$((100 + ${{ github.run_number }}))
          sed -i "s/versionCode 1/versionCode ${VER_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ steps.pkg.outputs.version }}\"/g" android/app/build.gradle
          npx cap copy android
          for dir in android/app/src/main/res/mipmap-*dpi; do
            if [ -d "$dir" ]; then
              cp public/pwa-512x512.png "$dir/ic_launcher.png"
              cp public/pwa-512x512.png "$dir/ic_launcher_round.png"
              cp public/pwa-maskable-512x512.png "$dir/ic_launcher_foreground.png"
            fi
          done
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Cronometro_3_misure_v.${{ steps.pkg.outputs.version }}.apk
          cd ../dist && zip -r ../Cronometro_3_misure_WebApp_v.${{ steps.pkg.outputs.version }}.zip .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cronometro_3_misure_v.${{ steps.pkg.outputs.version }}
          path: Cronometro_3_misure_v.${{ steps.pkg.outputs.version }}.apk

      - name: Publish Release in GitHub Releases Archive
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v.${{ steps.pkg.outputs.version }}
          name: Cronometro_3_misure_v.${{ steps.pkg.outputs.version }}
          body: "Release automatica Cronometro_3_misure_v.${{ steps.pkg.outputs.version }} (Build #${{ github.run_number }} - APK Android installabile con Firma Fissa + Web App)"
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            Cronometro_3_misure_v.${{ steps.pkg.outputs.version }}.apk
            Cronometro_3_misure_WebApp_v.${{ steps.pkg.outputs.version }}.zip

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web App to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Publish Web App Link on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
